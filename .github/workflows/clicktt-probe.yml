name: click-TT Abruf (Test)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/clicktt-probe.yml', 'scripts/clicktt_fetch.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/clicktt_fetch.py
      - name: In Branch clicktt-raw ablegen
        run: |
          cd raw
          git init -q -b clicktt-raw
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Rohdaten $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" clicktt-raw
